<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ultra Gesture Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* HUD UI */
        #ui-layer {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            color: rgba(255, 255, 255, 0.9);
            pointer-events: none;
            display: flex; flex-direction: column; gap: 10px;
        }
        h1 { margin: 0; font-weight: 300; letter-spacing: 2px; text-shadow: 0 0 15px rgba(0,255,255,0.5); }
        .hud-panel {
            background: rgba(0, 20, 40, 0.6);
            backdrop-filter: blur(5px);
            border-left: 3px solid #00ffcc;
            padding: 15px;
            border-radius: 0 10px 10px 0;
            width: 280px;
        }
        .gesture-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.9rem; }
        .icon { width: 25px; text-align: center; margin-right: 10px; font-size: 1.2rem; }
        .status { font-weight: bold; color: #ff0055; margin-left: auto; }
        
        /* Video Preview */
        #video-preview {
            position: absolute; bottom: 20px; right: 20px; z-index: 10;
            width: 240px; height: 180px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.2);
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffcc; font-size: 1.5rem; z-index: 20; }
    </style>
</head>
<body>

    <div id="loading">Initializing Neural Network...</div>

    <div id="ui-layer">
        <h1>AETHER PARTICLES</h1>
        <div class="hud-panel">
            <div class="gesture-item"><span class="icon">☝️</span> 1 Finger: <b>Heart</b></div>
            <div class="gesture-item"><span class="icon">✌️</span> 2 Fingers: <b>Moon</b></div>
            <div class="gesture-item"><span class="icon">🤟</span> 3 Fingers: <b>Cat</b></div>
            <div class="gesture-item"><span class="icon">🖐</span> Open Hand: <b>Galaxy</b></div>
            <div class="gesture-item"><span class="icon">✊</span> Fist: <b>Implode</b></div>
            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.2);">
            <div class="gesture-item"><span class="icon">👌</span> Pinch: <b>Scale</b></div>
            <div class="gesture-item"><span class="icon">🤏</span> Snap: <b>Shockwave</b></div>
            <div class="gesture-item"><span class="icon">🔄</span> Wrist: <b>3D Rotate</b></div>
        </div>
        <div class="hud-panel" style="width: auto; display: inline-block;">
            State: <span id="debug-state" style="color:#00ffcc">Waiting...</span>
        </div>
    </div>

    <div id="video-preview">
        <video id="input-video" playsinline></video>
    </div>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script>
        // ==========================================
        // 1. GRAPHICS ENGINE (Three.js)
        // ==========================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.02); // Depth fog
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 35;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- Texture Generator (Glowing Dot) ---
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grd = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grd.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grd.addColorStop(0.4, 'rgba(255, 255, 255, 0.5)');
            grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0,0,32,32);
            const tex = new THREE.Texture(canvas);
            tex.needsUpdate = true;
            return tex;
        }

        // --- Particle System Physics ---
        const PARTICLE_COUNT = 20000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        
        // Physics Arrays
        const targets = new Float32Array(PARTICLE_COUNT * 3);
        const velocities = new Float32Array(PARTICLE_COUNT * 3);
        
        // Initial setup
        const colorBase = new THREE.Color();
        const colorTarget = new THREE.Color();
        
        for(let i=0; i<PARTICLE_COUNT; i++) {
            const x = (Math.random() - 0.5) * 100;
            const y = (Math.random() - 0.5) * 100;
            const z = (Math.random() - 0.5) * 100;
            
            positions[i*3] = x;
            positions[i*3+1] = y;
            positions[i*3+2] = z;
            
            targets[i*3] = x;
            targets[i*3+1] = y;
            targets[i*3+2] = z;
            
            colors[i*3] = 0;
            colors[i*3+1] = 1;
            colors[i*3+2] = 1;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.4,
            map: createGlowTexture(),
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.9
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // ==========================================
        // 2. MATH SHAPES
        // ==========================================
        const Shapes = {
            // SPHERE / GALAXY
            sphere: (i) => {
                const r = 10 + Math.random() * 2;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                return {
                    x: r * Math.sin(phi) * Math.cos(theta),
                    y: r * Math.sin(phi) * Math.sin(theta),
                    z: r * Math.cos(phi)
                };
            },
            // HEART
            heart: (i) => {
                const t = Math.random() * Math.PI * 2;
                // Randomized thickness
                const z = (Math.random() - 0.5) * 4; 
                // Parametric Heart
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                return { x: x * 0.6, y: y * 0.6, z: z };
            },
            // CRESCENT MOON
            moon: (i) => {
                // Large sphere minus offset sphere logic, simplified to parametric torus/crescent
                const angle = Math.random() * Math.PI * 2;
                const r = 10;
                // Cut out a chunk to make a crescent
                if (angle > 0.5 && angle < 5.8) {
                    const width = Math.random() * 3;
                    return {
                        x: r * Math.cos(angle),
                        y: r * Math.sin(angle),
                        z: (Math.random()-0.5) * width
                    };
                }
                // Fill the gap randomly
                return Shapes.sphere(i); 
            },
            // CAT FACE
            cat: (i) => {
                const r = Math.random();
                // 70% Head, 15% Left Ear, 15% Right Ear
                if (r < 0.7) {
                    // Head (Oblate spheroid)
                    const s = Shapes.sphere(i);
                    return { x: s.x * 0.8, y: s.y * 0.6 - 2, z: s.z * 0.8 };
                } else if (r < 0.85) {
                    // Left Ear (Cone/Pyramid approx)
                    return { 
                        x: -5 + (Math.random() * 4), 
                        y: 4 + (Math.random() * 6), 
                        z: (Math.random()-0.5) * 2 
                    };
                } else {
                    // Right Ear
                    return { 
                        x: 5 - (Math.random() * 4), 
                        y: 4 + (Math.random() * 6), 
                        z: (Math.random()-0.5) * 2 
                    };
                }
            },
            // IMPLODE
            implode: (i) => {
                return { 
                    x: (Math.random()-0.5), 
                    y: (Math.random()-0.5), 
                    z: (Math.random()-0.5) 
                };
            }
        };

        // ==========================================
        // 3. LOGIC & STATE
        // ==========================================
        let currentShape = 'sphere';
        let targetColor = { r: 0, g: 1, b: 1 }; // Cyan
        let expansion = 1.0;
        let shockwave = 0;
        let rotationTarget = { x: 0, y: 0 };
        
        // Updates target array based on shape function
        function setShape(shapeName, colorHex) {
            if (currentShape === shapeName) return;
            currentShape = shapeName;
            
            const col = new THREE.Color(colorHex);
            targetColor = { r: col.r, g: col.g, b: col.b };

            for(let i=0; i<PARTICLE_COUNT; i++) {
                const pos = Shapes[shapeName](i);
                targets[i*3] = pos.x;
                targets[i*3+1] = pos.y;
                targets[i*3+2] = pos.z;
            }
        }
        
        // Initialize
        setShape('sphere', 0x00ffcc);

        // ==========================================
        // 4. HAND TRACKING (MediaPipe)
        // ==========================================
        const videoElement = document.getElementById('input-video');
        const debugState = document.getElementById('debug-state');
        let isSnapReady = false;

        function onResults(results) {
            document.getElementById('loading').style.display = 'none';

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // --- A. Count Fingers ---
                // Tips: 8(Index), 12(Middle), 16(Ring), 20(Pinky)
                // PIPs: 6, 10, 14, 18
                let fingers = 0;
                if (landmarks[8].y < landmarks[6].y) fingers++;
                if (landmarks[12].y < landmarks[10].y) fingers++;
                if (landmarks[16].y < landmarks[14].y) fingers++;
                if (landmarks[20].y < landmarks[18].y) fingers++;
                
                // Thumb is tricky, use X comparison depending on hand side. 
                // Simple approx: if tip is far from base x
                if (Math.abs(landmarks[4].x - landmarks[2].x) > 0.05) fingers++;

                // --- B. Gesture Logic ---
                
                // 1. FIST (0 fingers) -> Implode
                if (fingers === 0 || fingers === 1 && landmarks[8].y > landmarks[6].y) {
                    setShape('implode', 0xff0000);
                    debugState.innerText = "Fist: Implode";
                }
                // 2. ONE FINGER -> Heart
                else if (fingers === 1 || fingers === 2 && landmarks[12].y > landmarks[10].y) {
                    setShape('heart', 0xff0066);
                    debugState.innerText = "1 Finger: Heart";
                }
                // 3. TWO FINGERS -> Moon
                else if (fingers === 2) {
                    setShape('moon', 0xffffaa);
                    debugState.innerText = "2 Fingers: Moon";
                }
                // 4. THREE FINGERS -> Cat
                else if (fingers === 3) {
                    setShape('cat', 0xaa00ff);
                    debugState.innerText = "3 Fingers: Cat";
                }
                // 5. OPEN HAND -> Galaxy/Sphere
                else {
                    setShape('sphere', 0x00ffcc);
                    debugState.innerText = "Open: Galaxy";
                }

                // --- C. Advanced Interactions ---

                // 1. PINCH (Index 8 + Thumb 4) -> Controls Expansion
                const pinchDist = Math.hypot(landmarks[8].x - landmarks[4].x, landmarks[8].y - landmarks[4].y);
                // Map 0.02 (close) - 0.2 (far) to 0.5 - 2.0
                const targetExp = THREE.MathUtils.mapLinear(pinchDist, 0.02, 0.25, 0.3, 2.5);
                expansion = THREE.MathUtils.lerp(expansion, targetExp, 0.1);

                // 2. SNAP (Middle 12 + Thumb 4)
                const snapDist = Math.hypot(landmarks[12].x - landmarks[4].x, landmarks[12].y - landmarks[4].y);
                
                // Logic: Fingers must touch (charge), then separate quickly (trigger)
                if (snapDist < 0.04) {
                    isSnapReady = true;
                } else if (isSnapReady && snapDist > 0.1) {
                    // Trigger Shockwave
                    shockwave = 5.0; // High force
                    isSnapReady = false; 
                    debugState.innerText = "💥 SNAP! 💥";
                    // Randomize color on snap
                    targetColor.r = Math.random();
                    targetColor.g = Math.random();
                    targetColor.b = Math.random();
                }

                // 3. TWIST (Wrist Rotation)
                // Use wrist(0) and Middle Finger Base(9) to calculate angle
                const wristX = landmarks[0].x;
                const midBaseX = landmarks[9].x;
                // Calculate Tilt
                rotationTarget.y = (wristX - 0.5) * 3;
                rotationTarget.x = (landmarks[9].y - 0.5) * 2;

            } else {
                debugState.innerText = "No Hand Detected";
                // Idle animation
                expansion = THREE.MathUtils.lerp(expansion, 1.0 + Math.sin(Date.now()*0.002)*0.2, 0.05);
            }
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        const cam = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        cam.start();

        // ==========================================
        // 5. ANIMATION LOOP
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            // Rotate entire system based on wrist
            particles.rotation.y += (rotationTarget.y - particles.rotation.y) * 0.05;
            particles.rotation.x += (rotationTarget.x - particles.rotation.x) * 0.05;

            // Decay shockwave
            if (shockwave > 0) shockwave *= 0.9;

            const posAttr = geometry.attributes.position;
            const colAttr = geometry.attributes.color;

            // Physics Constants
            const stiffness = 0.04;
            const damping = 0.92;

            for(let i=0; i<PARTICLE_COUNT; i++) {
                const idx = i*3;
                
                // 1. Get State
                let px = posAttr.array[idx];
                let py = posAttr.array[idx+1];
                let pz = posAttr.array[idx+2];

                let vx = velocities[idx];
                let vy = velocities[idx+1];
                let vz = velocities[idx+2];

                let tx = targets[idx] * expansion;
                let ty = targets[idx+1] * expansion;
                let tz = targets[idx+2] * expansion;

                // 2. Shockwave logic (repel from center)
                if(shockwave > 0.1) {
                    const dist = Math.sqrt(px*px + py*py + pz*pz) + 0.1;
                    const force = shockwave / dist; // Stronger near center
                    vx += px * force;
                    vy += py * force;
                    vz += pz * force;
                }

                // 3. Spring Physics Integration
                // Acceleration = Distance * Stiffness
                const ax = (tx - px) * stiffness;
                const ay = (ty - py) * stiffness;
                const az = (tz - pz) * stiffness;

                // Update Velocity
                vx = (vx + ax) * damping;
                vy = (vy + ay) * damping;
                vz = (vz + az) * damping;

                // Update Position
                px += vx;
                py += vy;
                pz += vz;

                // Store back
                posAttr.array[idx] = px;
                posAttr.array[idx+1] = py;
                posAttr.array[idx+2] = pz;
                
                velocities[idx] = vx;
                velocities[idx+1] = vy;
                velocities[idx+2] = vz;

                // 4. Color Morphing
                colAttr.array[idx] += (targetColor.r - colAttr.array[idx]) * 0.05;
                colAttr.array[idx+1] += (targetColor.g - colAttr.array[idx+1]) * 0.05;
                colAttr.array[idx+2] += (targetColor.b - colAttr.array[idx+2]) * 0.05;
            }

            posAttr.needsUpdate = true;
            colAttr.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
